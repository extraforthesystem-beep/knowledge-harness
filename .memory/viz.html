<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

\n\n\n## Active branch\nNot set (will sync to GitHub later)\n\n## Last updated\n2026-07-27 20:15:43\n\n## Key paths\n- Entry point: [.memory/index.md](../index.md)\n- Cross-IDE: [CROSS-IDE.md](../../CROSS-IDE.md)\n- Install commands: `npx knowledge-harness install -g -y`\n- Sync: `python scripts/harness-sync.py`\n- Compact: `python scripts/memory-compact.py`\n- Benchmark: `python scripts/benchmark-harness.py --compare` \u2192 results + comparison TSV\n- Ablation: `python scripts/benchmark-ablation.py` \u2192 `docs/benchmark-ablation.tsv`\n- Peer comparison: [docs/memory-tool-comparison.md](../../docs/memory-tool-comparison.md)\n- Optional: `.memory/domains/` topic routers\n- Graph view: [.memory/viz.html](../viz.html)\n- Code discovery: `graphify-out/` \u2014 `/graphify query`\n- Failures (SRE): [failures/log.md](../failures/log.md)\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-05-20-gitignore-excluded-from-harness-template": "**Decision:** `.gitignore` is NOT part of the harness \u2014 it's framework/project-dependent\n**Why:** The harness is a framework-agnostic memory/context system. Each project brings its own `.gitignore`.\n**Alternatives considered:** Including a generic `.gitignore` in the harness \u2014 rejected because it would need overwriting per project anyway.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-05-20-graphifyignore-included-in-harness-template": "**Decision:** `.graphifyignore` IS part of the harness and should be deployed by the setup script\n**Why:** Token efficiency during graphify scans is a harness-level concern (cost/context optimization), not framework-specific.\n**Alternatives considered:** Leaving it as a manual step \u2014 rejected because it's universal to every project using the harness.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks": "**Status:** accepted\n**Decision:** Session End memory sync hooks should leverage session-native CLI environment authentication (or standard model aliases) rather than direct standalone fetch methods that require independent API keys.\n**Why:** Detached background scripts often lose terminal-level API key variables or encounter token/auth issues. Aligning hooks directly to native CLI parameters prevents unexpected session termination failures.\n**Alternatives considered:** Hardcoding proxy endpoints or isolated API key variables in local scripts \u2014 rejected as highly insecure and brittle.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-05-21-dynamic-path-resolution-for-global-hook-installations": "**Status:** accepted\n**Decision:** Global hook configurations (`hooks.json` / `settings.json`) should resolve system home directories dynamically rather than using hardcoded absolute file system paths.\n**Why:** Improves cross-platform and multi-user compatibility, ensuring that the unified harness remains functional when run across different machines or OS flavors (Windows/macOS/Linux) without requiring manual setup edits.\n**Alternatives considered:** Hardcoding machine-specific absolute user paths \u2014 rejected because it breaks portability and repo-level sharing.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-06-21-cross-ide-harness-parity": "**Decision:** Use `AGENTS.md` as the universal project router. Deploy slash-command templates via `scripts/install-harness.sh` to Claude (`~/.claude/commands/`), Antigravity (`~/.gemini/.../global_workflows/`), and OpenCode global `AGENTS.md`. Cursor uses project `AGENTS.md` + `.cursor/rules/knowledge-harness.mdc` + `.cursor/hooks.json`.\n\n**Why:** Agents should behave identically regardless of IDE. OKF `.memory/` is the single knowledge store; each tool only needs a thin config surface.\n\n**Alternatives considered:** Per-IDE duplicate memory formats \u2014 rejected. Tool-specific export mirrors \u2014 rejected.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-06-21-okf-native-memory-bundle": "**Decision:** Evolve `.memory/` in place into an OKF knowledge bundle. Graphify remains the codebase discovery layer. No separate `okf/` export folder and no GCP Knowledge Catalog toolchain.\n\n**Why:** OKF provides structured, linkable, portable concepts. Harness hooks and slash commands provide the operational layer. Merging both eliminates duplicate storage and aligns with local-first workflow.\n\n**Alternatives considered:** Export mirror (`.memory/` \u2192 `okf/`) \u2014 rejected as duplicate maintenance. GCP enrich/kcmd \u2014 rejected; user requires fully local operation.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-06-21-platform-agnostic-hooks-sre": "**Decision:** Ship upgraded Node hooks in `.cursor/hooks/` (inject, capture, sync) with OKF paths, token budget warnings, `.memory/` loop prevention, local journal fallback, and auto `harness-sync.py` on session end. Add `.memory/failures/log.md` and `.memory/meta/sre-routing.md` for SRE skill integration.\n\n**Why:** Preserves battle-tested behavior from the pre-OKF harness while using OKF concept paths. Works across Cursor, Claude Code, and Antigravity via shared `~/.claude/hooks/` deploy.\n\n**Alternatives considered:** Shell-only hooks \u2014 rejected; Node hooks already handle multi-IDE tool schema mapping.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-07-14-dogfood-sync-compact-domains": "**Status:** accepted\n\n**Context:** Trade Profit (`idea 3`) dogfooded the OKF harness at ADR scale (200+ decisions). Several sync/budget/navigation fixes lived only in that repo. Upstream them so every install gets the same behavior.\n\n**Decision \u2014 ship these harness improvements:**\n\n1. **`harness-sync.py` harden**\n   - macOS case-insensitive FS: never archive real `index.md` when cleaning stray `INDEX.md`\n   - Soft-fail `_legacy` / `log.md` OSError (TCC locks) so sync still completes\n   - Cap context inject at 1200 chars; only `in-progress`/`planned` features in token estimate and Active Features table\n   - `decisions/index.md` sorted by ADR number (archive section preserved)\n   - Optional **domain maps**: auto-discover `.memory/domains/*.md`, add to graph spine, link domains\u2192decisions, show Domain Maps entry point only when present\n\n2. **`memory-compact.py`**\n   - Automate `/memory-compact`: move `superseded`/`deprecated` ADRs and completed features older than 14d to `archive/`\n   - Command text runs the script instead of manual moves\n\n3. **`memory-init` scaffold**\n   - Create empty `domains/` (+ README) so projects know the optional pattern\n\n**Not upstreamed (project-specific):**\n- Idea 3 product domain files (deposits, MLM, engine, \u2026)\n- Idea 3 `AGENTS.md` Next.js / graphify project rules\n- Older idea 3 `sync-harness.sh` (harness copy is newer)\n\n**Consequences:** Re-run `node packages/knowledge-harness/scripts/bundle-assets.mjs` before publish. Existing projects get improvements by copying `scripts/harness-sync.py` + `memory-compact.py` or reinstalling the package.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-07-27-token-effectiveness-not-longmemeval": "**Decision:** Benchmark Knowledge Harness with (1) local inject/latency, (2) cited peer tables for context, and (3) with/without ablation on project questions. Do **not** claim LongMemEval R@5 or LoCoMo QA scores for `.memory/`.\n\n**Why:** Harness is structured project memory (progress, ADRs, failures). agentmemory / claude-mem / Mem0 / Letta are session or agent recall. Apples-to-apples scoreboard is tokens + time + hit-rate to answer project questions \u2014 measured ~97% fewer task tokens WITH vs WITHOUT.\n\n**Alternatives considered:** Run LongMemEval against harness \u2014 rejected (wrong layer). Only cite competitor R@5 without ablation \u2014 rejected (doesn't prove harness improvement).\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Memory Authority \u2014 challenge before overriding project truth](2026-07-28-memory-authority-challenge-protocol.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "decisions/2026-07-28-memory-authority-challenge-protocol": "**Decision:** Adopt Memory Authority as harness policy. Hard truth (ADRs, feature body/contract, architecture context) may not be silently overwritten \u2014 on conflict, override, remove, or architecture-bend the agent must challenge (`keep / update / remove / add`). Soft ops (progress, frontmatter status/priority, session-end hooks) sync without ceremony. Topic recall over `.memory/` is on demand (domains \u2192 keyword search); session inject stays progress-only. Code wins for runtime; memory wins for decided intent until the user overrides.\n\n**Why:** Long-lived projects fail when agents follow a new command and bend ADRs without pushback. Dogfooded in Trade Profit (idea 3), S1\u2013S5 PASS 2026-07-28.\n\n**Alternatives considered:** Ask before every memory write \u2014 rejected (breaks hooks and end-of-session sync). Fatten session inject with all related ADRs \u2014 rejected (token budget). Bundle session-recall plugins into harness core \u2014 rejected (wrong layer; out of scope).\n\n**Does not reverse:** OKF-native store, lean inject/token ablation, cross-IDE parity, no agent-loop in core, platform hooks.\n\n**Honest limit:** Markdown policy is soft enforcement \u2014 agents can ignore it; Authority still defines correct behavior.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "features/mega-harness": "## What it does\n- Evolves `.memory/` in place into an OKF knowledge bundle (frontmatter, concept linking, index.md, viz.html)\n- Keeps harness operational patterns: hooks, slash commands, token budget, PROGRESS workflow\n- Adds `scripts/migrate-memory-to-okf.py` and `scripts/harness-sync.py` for local sync (no GCP)\n- Uses graphify as the separate codebase discovery layer\n\n## Constraints\n- Local-only OKF: `reference-agent visualize` only; no enrich/kcmd/kcagent\n- Backward compat: flat files archived to `.memory/_legacy/`\n- Token budget target remains <500 tokens for session injection\n\n## Definition of done\n- [x] Migration script converts flat `.memory/` to OKF layout\n- [x] harness-sync regenerates index, log, viz.html\n- [x] CLAUDE.md and AGENTS.md updated to OKF-first router\n- [x] Harness.md slash command bodies updated via templates/commands/\n- [x] Cross-IDE install script and CROSS-IDE.md\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [Harness Router](../meta/router.md)\n- [SRE Memory Routing](../meta/sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "meta/memory-authority": "# Memory Authority\n\n`.memory/` is **project truth** (decisions, features, architecture). Session chat recall is a different layer. This protocol is behavioral (markdown policy) \u2014 not a mechanical lock.\n\n## Truth tiers\n\n| Tier | Paths | Behavior |\n|------|--------|----------|\n| **Hard truth** | `.memory/decisions/**`; feature **body/contract** under `.memory/features/**`; stack/phase/architecture in `context/project.md` | On **conflict, override, remove, or architecture-bend**: stop and challenge. Never edit old ADRs \u2014 append a new file. Non-conflicting new ADR (user already decided in-session): write, then summarize. |\n| **Soft ops** | `progress/status.md`; feature frontmatter-only `status`/`priority`; session-end hook progress | Sync without challenge ceremony. |\n| **Runtime** | Code | Code is what runs. Memory is what was decided. On drift: report + ask; do not silently rewrite the ADR or ignore the bug. |\n\n## Challenge shape\n\n**Default (short):**\n\n> Conflicts `<path>` \u2014 keep / update / remove / add?\n\n**Architecture bend:** first load the related picture (below), then challenge.\n\nDo **not** ask before every progress write or every non-conflicting ADR append.\n\n## Topic recall (on demand)\n\nWhen a topic comes up (or before a hard-truth change that might bend architecture):\n\n1. Read `.memory/domains/<topic>.md` if present (or `domains/index.md`)\n2. Keyword-search `.memory/decisions/`, `.memory/features/`, `.memory/failures/`\n3. Load only the hits needed for the bigger picture \u2014 stay lean\n\nDo **not** expand session-start inject beyond progress (budget `<500` tokens).\n\n## Agent workflow\n\n1. Topic recall if the task touches known domains or old decisions\n2. Classify soft vs hard vs runtime\n3. Soft \u2192 act; hard conflict/bend \u2192 challenge; runtime drift \u2192 report + ask\n4. After confirmed work \u2192 `/memory-sync`\n\n## Honest limit\n\nAgents can ignore markdown. Authority still matters: it is the shared rule that pushback is correct until the user overrides.\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [Harness Router](router.md)\n- [SRE Memory Routing](sre-routing.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "meta/router": "# Harness slash commands\n\n**Daily:** `/feature-add` \u00b7 `/memory-sync` (end of session \u2014 progress, ADRs, handoff, index/viz)\n\n**One-time:** `/memory-migrate` \u00b7 `/memory-init`\n\n**Rare:** `/memory-compact` \u00b7 `/failure-log`\n\n**Aliases \u2192 `/memory-sync` (not installed):** `/handoff` \u00b7 `/extract-memory` \u00b7 `/compact` \u00b7 `/harness-sync`\n\n# Agent workflow\n\n1. Read `.memory/index.md` then `progress/status.md`\n2. Topic recall on demand \u2192 [Memory Authority](memory-authority.md); for features \u2192 `features/<slug>.md`; for architecture \u2192 `decisions/` (or `domains/` topic map first if present)\n3. Hard truth conflict/bend \u2192 challenge before write; progress is soft\n4. For code exploration \u2192 `/graphify query` before grep\n5. After work \u2192 run `/memory-sync`\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [`.gitignore` excluded from harness template](../decisions/2026-05-20-gitignore-excluded-from-harness-template.md)\n- [`.graphifyignore` included in harness template](../decisions/2026-05-20-graphifyignore-included-in-harness-template.md)\n- [Direct Shell/CLI Authentication Inheritance for Hooks](../decisions/2026-05-21-direct-shell-cli-authentication-inheritance-for-hooks.md)\n- [Dynamic Path Resolution for Global Hook Installations](../decisions/2026-05-21-dynamic-path-resolution-for-global-hook-installations.md)\n- [Cross-IDE harness parity via shared AGENTS.md and install script](../decisions/2026-06-21-cross-ide-harness-parity.md)\n- [OKF-native .memory/ bundle as single knowledge store](../decisions/2026-06-21-okf-native-memory-bundle.md)\n- [Platform-agnostic hooks with SRE failure log](../decisions/2026-06-21-platform-agnostic-hooks-sre.md)\n- [Dogfood upstream \u2014 sync harden, memory-compact, optional domains](../decisions/2026-07-14-dogfood-sync-compact-domains.md)\n- [Score harness on token-effectiveness ablation, not LongMemEval](../decisions/2026-07-27-token-effectiveness-not-longmemeval.md)\n- [Memory Authority \u2014 challenge before overriding project truth](../decisions/2026-07-28-memory-authority-challenge-protocol.md)\n- [Mega Harness OKF Integration](../features/mega-harness.md)\n- [Memory Authority](memory-authority.md)\n- [SRE Memory Routing](sre-routing.md)\n- [Session Progress Archive](../progress/archive.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "meta/sre-routing": "# SRE Architect \u2014 OKF memory order\n\nWhen the `sre-architect` skill is active, fetch context in this order:\n\n| Step | Old flat path | OKF path |\n|------|---------------|----------|\n| 1 | INDEX.md | [.memory/index.md](../index.md) |\n| 2 | CONTEXT.md | [context/project.md](../context/project.md) |\n| 3 | PROGRESS.md | [progress/status.md](../progress/status.md) |\n| 4 | SYSTEM-MAP.md | project root `SYSTEM-MAP.md` (if present) |\n| 5 | DECISIONS.md | [decisions/](../decisions/index.md) |\n| 6 | FEATURES/*.md | [features/](../features/index.md) |\n| 7 | FAILURES.md | [failures/log.md](../failures/log.md) |\n\n## Micro-loop\n\nObserve \u2192 Predict \u2192 Act \u2192 Verify. On verify failure, escalate rollback ladder; after attempt 3, append a `FAIL-XXX` entry to [failures/log.md](../failures/log.md).\n\n## Token budget\n\nSession inject target <500 tokens. If [index.md](../index.md) reports over budget, run `/memory-compact` then `/harness-sync`.\n\n## Memory vs code (Memory Authority)\n\nWhen memory and code disagree: **code wins for runtime**; **memory wins for decided intent** until the user overrides. Report the drift; do not silently rewrite an ADR. Follow [Memory Authority](memory-authority.md).\n\n<!-- harness-links:autogen -->\n## Graph links\n\n- [Project Context](../context/project.md)\n- [Memory Authority](memory-authority.md)\n- [Harness Router](router.md)\n- [Session Progress](../progress/status.md)\n<!-- /harness-links:autogen -->", "progress/archive": "# Progress Archive\n\n## 2026-07-27 (benchmark session sync)\n- Ablation script + competitor compare docs landed; ADR: score on token-effectiveness not LongMemEval\n- Trimmed auto \"Modified files\" noise from status inject to stay under 500-token budget\n\n## 2026-07-27 (status trim after benchmark)\n- Moved verbose 2026-07-17 \"Modified files\" Done lines + older OKF/docs bullets out of status.md\n- Benchmark finding: session inject was ~749 tok (over 500) while index reported ~300 \u2014 hook injects full status.md, not index estimate\n\n## 2026-07-17 (status trim)\n- Deduped duplicate \"Modified files\" Done lines from </script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
